name: Backend CI (FastAPI & OIML Metrology Core)

on:
  push:
    branches: [ main, staging, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, staging, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-lint-and-test:
    name: Backend Lint, Metrology Tests & Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies (Pango, Cairo, HarfBuzz for WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libpango1.0-dev \
            libffi-dev \
            shared-mime-info \
            libjpeg-dev \
            libopenjp2-7-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax & Linting Checks
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-fatal but reports them
          flake8 app/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Execute Complete OIML R 76 Metrology & Document Test Suite
        run: |
          pytest tests/ -v --tb=short
